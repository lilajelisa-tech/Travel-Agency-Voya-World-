<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rezervime - Agjensi Udhëtimesh</title>
    <style>
        /* Reset bazik */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        form {
            background: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }

        h2 {
            margin-bottom: 25px;
            color: #004085;
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
        }

        label {
            display: block;
            margin-bottom: 8px;
            margin-top: 18px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1.8px solid #ccd6f6;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            border-color: #004085;
            outline: none;
            box-shadow: 0 0 6px rgba(0, 64, 133, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            margin-top: 28px;
            width: 100%;
            background-color: #004085;
            color: white;
            border: none;
            padding: 14px 0;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #003366;
        }

        #rezervim-mesazh {
            margin-top: 22px;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            min-height: 22px;
        }

        /* Për telefonë */
        @media (max-width: 480px) {
            form {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <form id="rezervim-form" novalidate>
        <h2>Rezervo një Paketë Udhëtimi</h2>

        <label for="paketa">Zgjidh Paketën:</label>
        <select id="paketa" name="paketa" required>
            <option value="">-- Zgjidh një paketë --</option>
            <option value="Itali">Itali</option>
            <option value="France">France</option>
            <option value="Spanje">Spanje</option>
            <option value="Gjermani">Gjermani</option>
            <option value="Greqi">Greqi</option>
            <option value="Austri">Austri</option>
            <option value="Holande">Holande</option>
            <option value="Kroaci">Kroaci</option>
            <option value="Portugali">Portugali</option>
            <option value="Zvicer">Zvicer</option>
        </select>

        <label for="emri">Emri:</label>
        <input type="text" id="emri" name="emri" placeholder="Emri juaj" required />

        <label for="id">Numri i ID:</label>
        <input type="text" id="id" name="id" placeholder="8 shifra" required />

        <label for="telefoni">Numri i telefonit:</label>
        <input type="tel" id="telefoni" name="telefoni" placeholder="+355 ..." required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="email@example.com" required />

        <label for="data">Data e udhëtimit:</label>
        <input type="date" id="data" name="data" required />

        <label for="pagesa">Forma e pagesës:</label>
        <select id="pagesa" name="pagesa" required>
            <option value="">-- Zgjidh një opsion --</option>
            <option value="email">Dërgo faturën me email</option>
            <option value="cash">Pagesë cash në agjensi</option>
        </select>

        <label for="mesazh">Mesazh shtesë:</label>
        <textarea id="mesazh" name="mesazh" placeholder="Preferenca, kërkesa apo komente të tjera..."></textarea>

        <button type="submit">Rezervo</button>

        <p id="rezervim-mesazh" style="display: none;"></p>
    </form>

<script>
    // Vendos data minimale në datën e sotme
    document.getElementById("data").min = new Date().toISOString().split("T")[0];

    document.getElementById("rezervim-form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const data = {
            paketa: this.paketa.value,
            emri: this.emri.value.trim(),
            id: this.id.value.trim(),
            telefoni: this.telefoni.value.trim(),
            email: this.email.value.trim(),
            data: this.data.value,
            pagesa: this.pagesa.value,
            mesazh: this.mesazh.value.trim(),
        };

        if (!/^\d{8}$/.test(data.id)) {
            alert("Numri i ID duhet të përmbajë saktësisht 8 shifra.");
            return;
        }

        try {
           const response = await fetch("http://localhost:3000/dergo-rezervimin", {

                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const msg = document.getElementById("rezervim-mesazh");
            msg.innerText = result.message;
            msg.style.color = result.status === 'success' ? 'green' : 'red';
            msg.style.display = 'block';

            if (result.status === 'success') {
                this.reset();
            }
        } catch (err) {
            alert("Gabim në lidhje me serverin.");
            console.error(err);
        }
    });
</script>
</body>
</html>
